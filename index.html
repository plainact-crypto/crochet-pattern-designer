<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Crochet Pattern Designer</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">⌁</div>
      <div>
        <h1>Crochet Pattern Designer</h1>
        <p>Build your chart row by row.</p>
      </div>
    </div>

    <div class="editor-controls">
      <label class="field">
        <span>Stitch</span>
        <select id="stitchSelect"></select>
      </label>

      <label class="field compact">
        <span>Direction</span>
        <select id="directionSelect">
          <option value="ltr">Left → Right</option>
          <option value="rtl">Right → Left</option>
        </select>
      </label>

      <button id="placeBtn" class="btn primary">Place</button>
      <button id="newRowBtn" class="btn">Next Row</button>
      <button id="rotateBtn" class="btn">Rotate 0°</button>
      <button id="deleteBtn" class="btn danger">Delete</button>
      <button id="undoBtn" class="btn">Undo</button>
      <button id="clearBtn" class="btn">Clear Board</button>
    </div>
  </header>

  <main class="workspace">
    <div class="board-wrap">
      <div id="board" class="board" aria-label="Crochet pattern whiteboard">
        <div id="emptyHint" class="empty-hint">
          Choose a stitch, then press <b>Place</b>.<br />The pattern will build itself row by row.
        </div>
      </div>
    </div>
    <div class="footer-bar">
      <span id="rowStatus">Row 1 · 0 stitches</span>
      <span id="selectedStatus">Nothing selected</span>
    </div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
