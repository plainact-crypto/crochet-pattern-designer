<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Crochet Pattern Designer</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <header class="cadbar">
    <div class="brandmark">
      <div class="logo">⌁</div>
      <div class="brandcopy">
        <strong>Crochet CAD</strong>
        <span>Pattern Designer</span>
      </div>
    </div>

    <div class="toolbar-group stitch-group">
      <span class="tool-label">STITCH</span>
      <select id="stitchSelect" aria-label="Choose stitch">
        <option value="chain">Chain (ch)</option>
        <option value="slip">Slip Stitch (sl st)</option>
        <option value="single">Single Crochet (sc)</option>
        <option value="half">Half Double Crochet (hdc)</option>
        <option value="double">Double Crochet (dc)</option>
        <option value="treble">Treble Crochet (tr)</option>
        <option value="dtr">Double Treble Crochet (dtr)</option>
        <option value="picot">Picot</option>
        <option value="puff">Puff Stitch</option>
        <option value="cluster">Cluster</option>
        <option value="shell">Shell</option>
        <option value="ring">Magic Ring</option>
      </select>
    </div>

    <div class="toolbar-group direction-group">
      <span class="tool-label">FLOW</span>
      <select id="directionSelect" aria-label="Row direction">
        <option value="ltr">Left → Right</option>
        <option value="rtl">Right → Left</option>
      </select>
    </div>

    <div class="toolbar-actions">
      <button id="placeBtn" class="tool-btn primary">Place</button>
      <button id="rotateBtn" class="tool-btn">Rotate</button>
      <button id="deleteBtn" class="tool-btn danger">Delete</button>
      <button id="undoBtn" class="tool-btn">Undo</button>
      <button id="clearBtn" class="tool-btn">Clear Board</button>
      <button id="newRowBtn" class="tool-btn accent">New Row</button>
    </div>
  </header>

  <main class="workspace">
    <div class="canvas-header">
      <span id="rowStatus">Row 1 · 0 stitches</span>
      <span class="canvas-title">WHITEBOARD</span>
      <span id="selectedStatus">Place rotation 0°</span>
    </div>

    <div class="board-wrap">
      <div id="board" class="board" aria-label="Crochet pattern whiteboard">
        <div id="emptyHint" class="empty-hint">
          <strong>Start drawing</strong>
          <span>Choose a stitch and press PLACE</span>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
